[package]
name = "blinc_abi"
version = "0.1.0"
edition = "2024"
description = "ABI for the Blinc UI"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
blinc_core = {git = "https://github.com/project-blinc/blinc", branch = "main"}
blinc_svg = {git = "https://github.com/project-blinc/blinc", branch = "main", features = ["svg_raster_images"]}
blinc_text = {git = "https://github.com/project-blinc/blinc", branch = "main"}
blinc_image = {git = "https://github.com/project-blinc/blinc", branch = "main", default-features = false, features = ["png", "jpeg", "webp"]}
blinc_layout = {git = "https://github.com/project-blinc/blinc", branch = "main", features = ["text_measurer"]}
hl_abi = {git="https://github.com/rayzor-blade/hl_abi", branch="main"}
taffy = { version = "0.14", features = ["content_size"] }
# Glyph outlines for text drawn on a canvas, scaled as blinc_text rasterizes its faces.
swash = "0.1"