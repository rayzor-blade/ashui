[package]
name = "ashui-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Native library packaging for Ashui"

[lib]
name = "blinc_abi"
path = "native/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# git-bug a8d3dd7: shared CSS order/row grids and equal-write idle suppression.
# git-bug e8233fb: shared native text alignment and exact inline line-edge checks.
# git-bug 2059910: a native version check for string signals, so SignalString can cache its decode.
blinc_abi_core = { package = "blinc_abi", git = "https://github.com/project-blinc/blinc_abi", rev = "d26858bf813ec795551f1875a4f6b0d979166407", default-features = false, features = ["hashlink"] }

[workspace]
resolver = "3"

# Smaller and faster: one optimisation unit across all crates, no symbols. A panic aborts:
# none is caught, and one crossing into HashLink would abort regardless.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# SVG is parsed and rasterized once per image and size, never per frame: small over fast.
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.tiny-skia-path]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.simplecss]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.blinc_svg]
opt-level = "s"
