[package]
name = "ashui-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Native library packaging for Ashui"

[lib]
name = "blinc_abi"
path = "native/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# git-bug a8d3dd7: shared CSS order/row grids and equal-write idle suppression.
# git-bug e8233fb: shared native text alignment and exact inline line-edge checks.
# git-bug 2059910: a native version check for string signals, so SignalString can cache its decode.
# git-bug 4778085: HashLink programs register bundled fonts. git-bug 53e48ad: a page's system face. git-bug 807fbba: a frame's atlas overflow.
# This is blinc_abi's branch ashui, d26858b with those commits and the Caribou plugin: blinc_abi main has a65b3a6, whose local glyph clips ashui does not apply (git-bug 9dadd58).
# git-bug 0fe11ba / 34d767c: explicit pointer overrides and intrinsic canvas sizing.
blinc_abi_core = { package = "blinc_abi", git = "https://github.com/project-blinc/blinc_abi", rev = "e2383b6cf07f8406793f410e6aff732d82ea7884", default-features = false, features = ["hashlink"] }

# The wasm side module allocates from the program's heap (native/lib.rs).
[target.'cfg(target_family = "wasm")'.dependencies]
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi", branch = "main" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi", branch = "main" }

[build-dependencies]
cc = "1.2"

[workspace]
resolver = "3"

# Smaller and faster: one optimisation unit across all crates, no symbols. A panic aborts:
# none is caught, and one crossing into HashLink would abort regardless.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# SVG is parsed and rasterized once per image and size, never per frame: small over fast.
[profile.release.package.usvg]
opt-level = "s"
[profile.release.package.resvg]
opt-level = "s"
[profile.release.package.tiny-skia]
opt-level = "s"
[profile.release.package.tiny-skia-path]
opt-level = "s"
[profile.release.package.roxmltree]
opt-level = "s"
[profile.release.package.svgtypes]
opt-level = "s"
[profile.release.package.simplecss]
opt-level = "s"
[profile.release.package.fontdb]
opt-level = "s"
[profile.release.package.blinc_svg]
opt-level = "s"
