name: publish Haxelib

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag; nightly is allowed for validation only'
        required: true
        type: string
      publish:
        description: 'Submit the validated release packages to Haxelib'
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      HAXELIB_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: haxelib-ashui
  cancel-in-progress: false

jobs:
  publish:
    name: validate and publish packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rayzor-blade/ashui
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGES: ashui ashui-components ashui-canvaskit ashui-media
    steps:
      # Use the maintained publisher even when submitting an older release.
      - uses: actions/checkout@v7
        with:
          repository: rayzor-blade/ashui
          ref: main
          persist-credentials: false
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6
      - run: haxelib newrepo
      - name: Download the existing release packages
        run: |
          mkdir -p release
          for name in $PACKAGES; do
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
              --pattern "$name.zip" --dir release
          done
      - name: Validate archives, versions and native libraries
        run: python3 scripts/publish_haxelib.py release --packages $PACKAGES --tag "$RELEASE_TAG" --prepare-contributors
      - name: Submit in dependency order
        if: inputs.publish
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: python3 scripts/publish_haxelib.py release --packages $PACKAGES --tag "$RELEASE_TAG" --prepare-contributors --submit
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: validated-haxelibs-ashui
          path: release/*.zip
          if-no-files-found: error
